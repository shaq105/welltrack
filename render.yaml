services:
  - type: web
    name: welltrack-backend
    env: node
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: welltrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Set CORS_ORIGIN to your Vercel frontend URL after deploying (e.g. https://welltrack.vercel.app)
      - key: CORS_ORIGIN
        sync: false
      # Set SMTP_* vars in the Render dashboard for password-reset emails
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: welltrack-db
    databaseName: welltrack
    user: welltrack
    region: oregon
    plan: free
